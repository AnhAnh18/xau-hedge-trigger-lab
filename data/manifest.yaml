  propagation_scope: same_account_server_2026_summer_reports
  globally_confirmed: false
  evidence:
    - unique_long_tick_gap_near_server_midnight
    - tick_activity_peak_at_server_hours_16_to_18
  limitation: does_not_establish_year_round_dst_rule

validation_plan:
  id: m5_external_sessions_v1
  machine_readable_plan: data/m5_acquisition_plan.json
  registered_on: "2026-07-26"
  status: pending_acquisition
  selection_rule: first_three_contiguous_full_broker_sessions_after_current_tick_export
  sessions:
