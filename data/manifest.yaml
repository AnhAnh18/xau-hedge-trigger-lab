      tick_dataset_id: ticks_xauusd_2026_07_27
      status: planned
    - date: "2026-07-28"
      tick_dataset_id: ticks_xauusd_2026_07_28
      status: planned
    - date: "2026-07-29"
      tick_dataset_id: ticks_xauusd_2026_07_29
      status: planned
  required_trade_report:
    dataset_id: trades_week_2026_07_26_08_01
    status: planned
  raw_files_committed_to_git: false
  substitution_policy: amend_manifest_before_inspecting_any_replacement_result
  analysis_windows:
    primary:
      server_hours: "12:00-24:00"
      applies_to: development_holdout_and_external_validation
      gate_eligible: true
      locked_before_external_acquisition: true
    secondary_full_session:
      server_hours: full_registered_session
      applies_to: external_validation_2026_07_27_to_2026_07_29
      gate_eligible: false
      purpose: asian_session_transportability
      locked_before_external_acquisition: true
  day_of_week_limitation:
    development: Thursday
    holdout: Friday
    external_validation: Monday_Tuesday_Wednesday
    status: perfectly_confounded_in_current_split
  coverage_gap_policy:
    threshold_seconds: 60
    default_classification: unknown_coverage_gap
    scheduled_classification_rule: recurring_same_server_clock_pattern_across_sessions
    retune_after_results: false

