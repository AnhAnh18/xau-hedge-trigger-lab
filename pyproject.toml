[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-trigger-lab"
version = "0.1.0"
dependencies = ["numpy>=1.24", "pandas>=2.0", "lxml>=4.9", "pyarrow>=14.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
