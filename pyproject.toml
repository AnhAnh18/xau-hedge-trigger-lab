[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xau-trigger-lab"
version = "0.1.0"
requires-python = ">=3.14.2,<3.15"
dependencies = ["numpy==2.5.1", "pandas==3.0.5", "lxml==6.1.1", "pyarrow==25.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
